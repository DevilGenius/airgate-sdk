syntax = "proto3";

package airgate.plugin.v1;

option go_package = "github.com/DouDOU-start/airgate-sdk/proto";

// ==================== 插件基础服务 ====================

service PluginService {
    rpc GetInfo(Empty) returns (PluginInfoResponse);
    rpc Init(InitRequest) returns (Empty);
    rpc Start(Empty) returns (Empty);
    rpc Stop(Empty) returns (Empty);
    // 获取插件的前端静态资源
    rpc GetWebAssets(Empty) returns (WebAssetsResponse);
    // 健康检查（可选，插件未实现时返回成功）
    rpc HealthCheck(Empty) returns (Empty);
    // 通用请求代理：Core 透传，插件自行路由（可选，插件未实现时返回 501）
    rpc HandleRequest(HttpRequest) returns (HttpResponse);
}

// ==================== 网关服务 ====================

service GatewayService {
    rpc GetPlatform(Empty) returns (StringResponse);
    rpc GetModels(Empty) returns (ModelsResponse);
    rpc GetRoutes(Empty) returns (RoutesResponse);
    rpc Forward(ForwardRequest) returns (ForwardResult);
    rpc ForwardStream(ForwardRequest) returns (stream ForwardChunk);
    rpc ValidateAccount(CredentialsRequest) returns (Empty);
    rpc QueryQuota(CredentialsRequest) returns (QuotaInfoResponse);
    // WebSocket 双向流
    rpc HandleWebSocket(stream WebSocketFrame) returns (stream WebSocketFrame);
}

// ==================== 扩展服务 ====================

service ExtensionService {
    rpc Migrate(Empty) returns (Empty);
    rpc GetBackgroundTasks(Empty) returns (BackgroundTasksResponse);
    // 由 Core 调度器按 Interval 周期触发；插件进程内查表执行 Handler
    rpc RunBackgroundTask(RunBackgroundTaskRequest) returns (Empty);
    // HTTP 请求由核心代理到插件
    rpc HandleRequest(HttpRequest) returns (HttpResponse);
    rpc HandleStreamRequest(HttpRequest) returns (stream HttpResponseChunk);
}

// ==================== 通用消息 ====================

message Empty {}

message StringResponse {
    string value = 1;
}

// HeaderValues 支持同一 Header 有多个值（如 Set-Cookie）
message HeaderValues {
    repeated string values = 1;
}

// ==================== 插件信息 ====================

message PluginInfoResponse {
    string id = 1;
    string name = 2;
    string version = 3;
    string description = 4;
    string author = 5;
    string type = 6;
    repeated AccountTypeProto account_types = 7;
    repeated FrontendPageProto frontend_pages = 8;
    repeated FrontendWidgetProto frontend_widgets = 9;
    string sdk_version = 10;                          // 插件编译时的 SDK 版本
    repeated string dependencies = 11;                // 依赖的其他插件 ID
    repeated ConfigFieldProto config_schema = 12;     // 配置项声明
    repeated string instruction_presets = 13;         // 可用的 instructions 预设名称列表
}

message ConfigFieldProto {
    string key = 1;
    string label = 2;
    string type = 3;
    bool   required = 4;
    string default_value = 5;
    string description = 6;
    string placeholder = 7;
}

message AccountTypeProto {
    string key = 1;
    string label = 2;
    string description = 3;
    repeated CredentialFieldProto fields = 4;
}

message CredentialFieldProto {
    string key = 1;
    string label = 2;
    string type = 3;
    bool   required = 4;
    string placeholder = 5;
    bool   edit_disabled = 6; // 编辑模式下隐藏该字段
}

message FrontendPageProto {
    string path = 1;
    string title = 2;
    string icon = 3;
    string description = 4;
    string audience = 5; // "admin" | "user" | "all"，空 = "admin"
}

message FrontendWidgetProto {
    string slot = 1;
    string entry_file = 2;
    string title = 3;
}

message InitRequest {
    map<string, string> config = 1;
    string log_level = 2;
}

// ==================== 网关消息 ====================

message ModelInfoProto {
    string id = 1;
    string name = 2;
    reserved 3; // 原 max_tokens，拆分为 context_window + max_output_tokens
    double input_price = 4;
    double output_price = 5;
    double cached_input_price = 6;
    double input_price_priority = 7;
    double output_price_priority = 8;
    double cached_input_price_priority = 9;
    int64  context_window = 10;
    int64  max_output_tokens = 11;
}

message ModelsResponse {
    repeated ModelInfoProto models = 1;
}

message RouteDefinitionProto {
    string method = 1;
    string path = 2;
    string description = 3;
}

message RoutesResponse {
    repeated RouteDefinitionProto routes = 1;
}

message AccountProto {
    int64  id = 1;
    string name = 2;
    string platform = 3;
    string type = 4;
    bytes  credentials_json = 5;
    string proxy_url = 6;
}

message ForwardRequest {
    reserved 1, 2, 3, 4, 5, 6; // 原散落的 account 字段，已合并为 AccountProto
    bytes  body = 7;
    map<string, HeaderValues> headers = 8;
    string model = 9;
    bool   stream = 10;
    AccountProto account = 11;
}

message ForwardResult {
    int64  status_code = 1;
    int64  input_tokens = 2;
    int64  output_tokens = 3;
    int64  cached_input_tokens = 4;
    string model = 5;
    int64  duration_ms = 6;
    string account_status = 7;   // "" / "rate_limited" / "disabled" / "expired"
    string error_message = 13;   // 上游错误信息（记录到账号 error_msg）
    int64  retry_after_ms = 8;   // 限流时建议等待时间（毫秒）
    bytes  body = 9;             // 非流式响应体
    map<string, HeaderValues> headers = 10;  // 非流式响应头
    string service_tier = 11;
    map<string, string> updated_credentials = 12;
    int64  reasoning_output_tokens = 14;  // 推理输出 token 数（o1/o3 等模型）
    int64  first_token_ms = 15;           // 首 token 延迟（毫秒）
    double input_cost = 16;               // 输入费用（USD，插件计算）
    double output_cost = 17;              // 输出费用（USD，插件计算）
    double cached_input_cost = 18;        // 缓存输入费用（USD，插件计算）
    double input_price = 19;              // 输入单价（$/1M token）
    double output_price = 20;             // 输出单价（$/1M token）
    double cached_input_price = 21;       // 缓存输入单价（$/1M token）
}

message ForwardChunk {
    bytes data = 1;
    bool  done = 2;
    ForwardResult final_result = 3;
    int32 status_code = 4;
    map<string, HeaderValues> headers = 5;
}

message CredentialsRequest {
    map<string, string> credentials = 1;
}

message QuotaInfoResponse {
    double total = 1;
    double used = 2;
    double remaining = 3;
    string currency = 4;
    string expires_at = 5;
    map<string, string> extra = 6;
}

// ==================== HTTP 代理消息 ====================

message HttpRequest {
    string method = 1;
    string path = 2;
    string query = 3;
    map<string, HeaderValues> headers = 4;
    bytes  body = 5;
    string remote_addr = 6;
}

message HttpResponse {
    int32  status_code = 1;
    map<string, HeaderValues> headers = 2;
    bytes  body = 3;
}

message HttpResponseChunk {
    bytes data = 1;
    bool  done = 2;
    int32 status_code = 3;
    map<string, HeaderValues> headers = 4;
}

// ==================== 扩展消息 ====================

message BackgroundTaskProto {
    string name = 1;
    int64  interval_ms = 2;
}

message BackgroundTasksResponse {
    repeated BackgroundTaskProto tasks = 1;
}

message RunBackgroundTaskRequest {
    string name = 1;
}

// ==================== WebSocket 消息 ====================

message WebSocketFrame {
    enum FrameType {
        CONNECT = 0;   // 连接建立，携带元信息（仅第一帧）
        TEXT    = 1;   // 文本消息
        BINARY  = 2;   // 二进制消息
        CLOSE   = 3;   // 关闭连接
        RESULT  = 4;   // 连接结束，携带 ForwardResult
    }

    FrameType type = 1;
    bytes     data = 2;

    // 仅 CONNECT 帧使用
    WebSocketConnectInfo connect_info = 3;

    // 仅 CLOSE 帧使用
    int32  close_code   = 4;
    string close_reason = 5;

    // 仅 RESULT 帧使用
    ForwardResult result = 6;
}

message WebSocketConnectInfo {
    string path  = 1;
    string query = 2;
    map<string, HeaderValues> headers = 3;
    string remote_addr    = 4;
    string connection_id  = 5;
    reserved 6, 7, 8, 9, 10, 11; // 原散落的 account 字段，已合并为 AccountProto
    AccountProto account = 12;
}

// ==================== 前端资源 ====================

message WebAssetFile {
    string path = 1;
    bytes content = 2;
}

message WebAssetsResponse {
    repeated WebAssetFile files = 1;
    bool has_assets = 2;
}
