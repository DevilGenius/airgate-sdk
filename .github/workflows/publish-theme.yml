name: 发布主题包

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: 发布 @devilgenius/airgate-theme
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: 启用 pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.12.0 --activate

      - name: 安装依赖
        working-directory: theme
        run: pnpm install --frozen-lockfile

      - name: 构建包
        working-directory: theme
        run: pnpm run build

      - name: 检查包内容
        working-directory: theme
        run: pnpm pack --dry-run

      - name: 打包 Release 资产
        working-directory: theme
        run: |
          mkdir -p ../dist
          pnpm pack --pack-destination ../dist
          mv ../dist/devilgenius-airgate-theme-*.tgz "../dist/airgate-theme-${GITHUB_REF_NAME}.tgz"

      - name: 创建/更新 GitHub Release 并上传资产
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/airgate-theme-${{ github.ref_name }}.tgz

      - name: 发布 npm 包
        working-directory: theme
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN 未配置，跳过 npm publish"
            exit 0
          fi
          pnpm publish --access public --no-git-checks
